<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Trip - TripSplit</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body data-page="create-trip"><header class="topbar"><a class="brand" href="/">TripSplit</a><nav><a href="/trips">Trips</a></nav></header><main class="container narrow"><div class="page-title"><p class="eyebrow">NEW TRIP</p><h1>Create a trip</h1></div><form id="tripForm" class="panel form-grid"><label>Trip name<input id="tripName" required maxlength="120" placeholder="Ooty Trip"></label><label>Description<textarea id="tripDescription" rows="4" placeholder="College friends trip"></textarea></label><div class="two-col"><label>Start date<input id="startDate" type="date" required></label><label>End date<input id="endDate" type="date" required></label></div><div id="formMessage" class="message hidden"></div><button class="button" type="submit">Create Trip</button></form></main><script src="/js/app.js"></script></body></html>
