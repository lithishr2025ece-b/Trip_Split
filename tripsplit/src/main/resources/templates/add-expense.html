<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Expense - TripSplit</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body data-page="add-expense"><header class="topbar"><a class="brand" href="/">TripSplit</a><nav><a href="/trips">Trips</a></nav></header><main class="container narrow"><a id="backLink" class="back" href="#">← Back to trip</a><div class="page-title"><p class="eyebrow">SHARED EXPENSE</p><h1>Add expense</h1></div><form id="expenseForm" class="panel form-grid"><label>Description<input id="expenseDescription" required placeholder="Hotel"></label><label>Amount (₹)<input id="expenseAmount" type="number" min="0.01" step="0.01" required placeholder="3000.00"></label><label>Paid by<select id="payerId" required></select></label><label>Expense date<input id="expenseDate" type="date" required></label><fieldset><legend>Shared by</legend><div id="participantChecks" class="check-grid"></div></fieldset><div id="formMessage" class="message hidden"></div><button class="button" type="submit">Save Expense</button></form></main><script src="/js/app.js"></script></body></html>
